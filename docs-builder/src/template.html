<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{full_title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#fcfcfd">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{full_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="TaskNotes">
  <meta name="twitter:card" content="summary">
  {{robots}}
  <script>
    (() => {
      const stored = localStorage.getItem("mdbase:theme");
      const preference = stored === "light" || stored === "dark" ? stored : "system";
      const resolved = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="/" aria-label="TaskNotes documentation home">
      <svg class="brand__mark" viewBox="0 0 100 100" aria-hidden="true">
        <path fill="currentColor" d="M98.5.6c-2.2-.1-5.8 2.1-7.1 3.4-3.8 3.5-9.4 11.1-15.4 18.4 3.4 7.4 1.5 17.1-9.8 28.1-8.7 8.4-16.7 14.4-21.3 20.6-4.5 6-6.2 12-2.8 22.1.2-.2.4-.5.5-.8 10.6-19.7 17.9-27.3 41.9-47.1 4.8-4 4.8-9.5 6-17 1-7 2.7-15.6 8.5-26.8.7-1.4.8-2.2.3-2.7-.2-.2-.5-.3-.8-.2ZM72.7 26.3c-9.7 11.9-21.2 25.5-30.8 32.8-5.9 4.6-11.8-4.4-17.2-9.8-5.2-6.9-9.6-12.7-12.3-6.7-1 2.6-1.6 6.2-3.4 10.1 4.1.6 7.3 2.3 9.8 4.5 6.1 5.4 8.1 13.8 12.4 17.3 1.9 1.8 4.1 3 7.5 3.2.7-1.4 1.6-2.7 2.5-4 5.2-7.1 13.3-13 21.8-21.2 7.5-7.3 12.7-17.7 9.7-26.2ZM6.4 56.9c-1.1 1.4-2.4 2.8-4.1 4.1-4.8 4 2 7 9.8 12 7.3 4.7 17.8 11.6 25.7 24.2.6 1 1.7 2 2.9 2.6-.9-5.4-.9-8.8-.5-11.9-3.3-.6-6.1-2.1-8.4-4.7-5.7-6.3-7.5-13.7-12.6-18.3-3-2.7-7-4.6-12.8-4.7Z"/>
      </svg>
      <span class="brand__copy">
        <strong>TaskNotes</strong>
        <span>Documentation</span>
      </span>
    </a>

    <div class="site-header__actions">
      <button class="search-trigger" id="js-search-open" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg>
        <span>Search</span>
        <kbd>⌘ K</kbd>
      </button>
      <label class="theme-control">
        <span class="sr-only">Colour theme</span>
        <select id="js-theme" aria-label="Colour theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button class="menu-trigger" id="js-menu" type="button" aria-label="Open documentation navigation" aria-expanded="false" aria-controls="js-sidebar">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
      </button>
    </div>
  </header>

  <div class="site-shell">
    <aside class="sidebar" id="js-sidebar" aria-label="Documentation">
      <div class="sidebar__mobile-header">
        <span>Documentation</span>
        <button id="js-menu-close" type="button" aria-label="Close documentation navigation">Close</button>
      </div>
      <nav class="sidebar__nav" aria-label="TaskNotes documentation">
        {{nav}}
      </nav>
      <footer class="sidebar__footer">
        <span>TaskNotes {{version}}</span>
        <a href="https://github.com/callumalpass/tasknotes">GitHub</a>
        <a href="/llms.txt">LLM index</a>
      </footer>
    </aside>

    <div class="sidebar-overlay" id="js-overlay" aria-hidden="true"></div>

    <main class="prose" id="main">
      {{content}}
    </main>

    <aside class="toc-column" aria-label="Page outline">
      {{toc}}
    </aside>
  </div>

  <dialog class="search-dialog" id="js-search">
    <div class="search-dialog__header">
      <label for="js-search-input">Search TaskNotes documentation</label>
      <button id="js-search-close" type="button" aria-label="Close search">Close</button>
    </div>
    <input id="js-search-input" type="search" autocomplete="off" placeholder="Commands, settings, Bases…">
    <p class="search-dialog__hint" id="js-search-status" aria-live="polite">Type at least two characters.</p>
    <ol class="search-results" id="js-search-results"></ol>
  </dialog>

  <script src="/js/main.js"></script>
</body>
</html>
