spec_version: 0.3.0
name: TaskNotes
description: Task collection managed by TaskNotes for Obsidian
settings:
  types_folder: _types
  contracts_folder: _contracts
  record_extensions:
    - md
  validation: warn
  explicit_type_keys:
    - mdbase_type
  id_field: id
  exclude:
    - _types
x-obsidian:
  bases:
    include:
      - TaskNotes/Views/**/*.base
