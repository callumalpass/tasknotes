name: Test Suite

on:
  push:
    branches: [ main, develop, v3-maintenance ]
  pull_request:
    branches: [ main, develop, v3-maintenance ]

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      timeout-minutes: 5

    - name: Test bundle size guard and dependency deduplication
      run: node --test scripts/check-bundle-size.test.mjs scripts/bundle-dependencies.test.mjs

    - name: Build production plugin
      run: npm run build
      timeout-minutes: 10

    - name: Check Obsidian Sync bundle size budget
      run: npm run check:bundle-size

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      timeout-minutes: 5

    - name: Check authored Lingui catalogues and Obsidian UI source
      run: npm run i18n:check
      timeout-minutes: 5

    - name: Test catalogue and source contract fixtures
      run: npm run test:i18n-source && npm run test:translation-contracts
      timeout-minutes: 3

    - name: Debug environment
      run: |
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Timezone: $(date)"
        echo "Jest version: $(npx jest --version)"

    - name: Install documentation dependencies
      run: npm ci
      working-directory: docs-builder
      timeout-minutes: 3

    - name: Run docs quality checks
      run: npm run docs:check
      timeout-minutes: 3
      
    - name: Run linter
      run: npm run lint
      timeout-minutes: 10

    - name: Test language-pack export, build isolation, and local delivery
      run: npm run test:language-packs
      timeout-minutes: 3

    - name: Generate release notes import
      run: node generate-release-notes-import.mjs
      timeout-minutes: 1

    - name: Run type check
      run: npm run typecheck
      timeout-minutes: 5
      
    - name: Run unit tests with coverage
      run: npm run test:ci -- --verbose
      timeout-minutes: 15
      
    - name: Run integration tests
      run: npm run test:integration
      timeout-minutes: 10
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false
        
    - name: Performance benchmarks
      run: npm run test:performance
      timeout-minutes: 10
      if: matrix.node-version == '20' # Only run on latest Node
      
    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          coverage/
          test-results/
          
  build-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      timeout-minutes: 5
      
    - name: Build plugin
      env:
        GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
      run: |
        cat <<EOF > .env
        GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
        MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID}
        EOF
        npm run build
      timeout-minutes: 10
      
    - name: Export versioned language packs
      run: npm run i18n:export
      timeout-minutes: 3

    - name: Test built plugin
      run: npm run test:build
      timeout-minutes: 5
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-build
        path: |
          main.js
          manifest.json
          styles.css
          dist/language-packs/
