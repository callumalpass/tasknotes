name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'

env:
  PLUGIN_NAME: tasknotes

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify prepared release identity
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          node scripts/verify-release-source.mjs "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=docs/releases/$VERSION.md" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Build Plugin
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          cat <<EOF > .env
          GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
          GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
          MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID}
          EOF
          npm run build  # This includes CSS building via npm run build-css

      - name: Check Obsidian Sync bundle size budget
        run: npm run check:bundle-size

      - name: Verify release notes
        run: |
          if [ ! -f "$RELEASE_NOTES_PATH" ]; then
            echo "Release notes file not found: $RELEASE_NOTES_PATH"
            exit 1
          fi
          echo "Using release notes from $RELEASE_NOTES_PATH"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            main.js
            manifest.json
            styles.css
          prerelease: ${{ contains(env.VERSION, '-') }}
          draft: true
